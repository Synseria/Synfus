# SynfusMark est aussi compilé seul par Tools/AppIconExport.swift
# (generate-app-icons.sh) : ce que l'app n'appelle pas sert à l'icône du bundle.
retain_files:
  - Sources/Synfus/Marque/SynfusMark.swift
# JetonsPropres.swift est engendré par le SDS (Synseria-Design) depuis la fiche de Synfus, avec
# toutes ses valeurs, même celles que l'app ne lit pas : il ne se retouche pas ici, son code mort ne
# se rapporte pas.
report_exclude:
  - Sources/Synfus/Interface/JetonsPropres.swift
