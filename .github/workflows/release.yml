name: Release

# Un tag « vX.Y.Z » suffit à publier :  git tag v0.1.0 && git push origin v0.1.0
# Le déclenchement manuel sert à rejouer une release ratée sans retaguer.
#
# Le filtre est strict — « v* » acceptait « v.0.1.0 », dont `${TAG#v}` tire la
# version « .0.1.0 » : des DMG mal nommés et un CFBundleShortVersionString que
# macOS refuse. Un tag mal formé ne déclenche donc plus rien du tout.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (ex. v0.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    # macOS 26 est imposé par le SDK : BarView utilise glassEffect (Liquid Glass),
    # qui n'existe pas dans les SDK antérieurs. Le deployment target reste 14.0,
    # donc le binaire produit ici tourne de macOS 14 à 26 — la bascule vers le
    # matériau translucide se fait à l'exécution.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Sélectionner Xcode
        run: |
          LATEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$LATEST"
          swift --version
          xcrun --show-sdk-version

      - name: Déterminer la version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Le filtre de déclenchement ne couvre pas workflow_dispatch, dont le
          # tag est saisi à la main : on revérifie ici plutôt que de produire une
          # release au nom cassé.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag « $TAG » mal formé — attendu vX.Y.Z (ex. v0.1.0)."
            exit 1
          fi
          echo "tag=$TAG"             >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"     >> "$GITHUB_OUTPUT"

      - name: Tests
        run: swift test

      - name: Construire les DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x build.sh make-dmg.sh
          mkdir -p dist
          # Les deux tranches sont compilées avec le même SDK ; x86_64 est
          # produit par cross-compilation depuis le runner Apple Silicon.
          for arch in arm64 x86_64; do
            ARCH="$arch" ./build.sh
            ./make-dmg.sh dist/Synfus.app "dist/Synfus-$VERSION-$arch.dmg"
            rm -rf dist/Synfus.app dist/fr.synseria.synfus.sdPlugin
          done
          shasum -a 256 dist/*.dmg | tee dist/SHA256SUMS.txt

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<'EOF'
          ### Téléchargement

          | Mac | Fichier |
          | --- | --- |
          | Apple Silicon (M1 → M4) | `Synfus-VERSION-arm64.dmg` |
          | Intel | `Synfus-VERSION-x86_64.dmg` |

          Compatible macOS 14 (Sonoma) à macOS 26. L'effet Liquid Glass de la barre
          n'apparaît que sur macOS 26 ; en deçà la barre utilise un matériau translucide.

          ### Installation

          **1.** Monter le DMG et glisser **Synfus** dans **Applications**.

          **2.** Lever la quarantaine — **avant** de lancer l'app :

          ```sh
          xattr -dr com.apple.quarantine /Applications/Synfus.app
          ```

          ⚠️ Cette étape n'est pas facultative, et son oubli ne se voit pas :
          l'app **se lance normalement**, mais l'autorisation Accessibilité
          n'a alors aucun effet — la case se coche dans les Réglages et Synfus
          continue de dire qu'il n'est pas autorisé. Copier l'app depuis le DMG
          emmène l'attribut avec elle : le retirer du DMG ne suffit pas.

          **3.** Lancer Synfus, puis l'autoriser dans **Réglages Système →
          Confidentialité et sécurité → Accessibilité**.

          Si l'app a déjà été lancée avant l'étape 2, réinitialiser l'autorisation
          après avoir levé la quarantaine :

          ```sh
          tccutil reset Accessibility fr.synseria.Synfus
          ```

          ### Pourquoi ces manipulations

          Les binaires publiés ici sont signés **ad-hoc** et non notarisés : le
          projet n'a pas de certificat *Developer ID* (compte Apple Developer
          payant). macOS n'a donc aucune identité stable à associer à l'app, et
          se rabat sur l'empreinte du binaire. Conséquence : **chaque nouvelle
          version doit être réautorisée** — retirer l'ancienne entrée dans la
          liste Accessibilité, puis rajouter la nouvelle.

          Compiler depuis les sources (`./build.sh --install`) évite tout cela.
          EOF
          sed -i '' "s/VERSION/$VERSION/g" notes.md

          # Créer la release échoue si elle existe déjà — c'est le cas dès qu'on
          # l'a ouverte depuis l'interface GitHub (ce qui pousse le tag et
          # déclenche ce workflow), ou qu'on rejoue une exécution. On téléverse
          # alors dans la release en place, en écrasant les fichiers homonymes.
          FICHIERS=(
            dist/Synfus-"$VERSION"-arm64.dmg
            dist/Synfus-"$VERSION"-x86_64.dmg
            dist/SHA256SUMS.txt
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "▸ Release $TAG déjà présente — mise à jour."
            gh release edit "$TAG" --title "Synfus $VERSION" --notes-file notes.md
            gh release upload "$TAG" "${FICHIERS[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "Synfus $VERSION" \
              --notes-file notes.md \
              "${FICHIERS[@]}"
          fi
