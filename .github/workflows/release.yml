name: Release

# Rejouer la publication d'un tag existant (Tools/publier-release.sh, le même
# chemin que `sh build.sh --publish X.Y.Z` depuis le Mac). Quand le runner
# aura Xcode 27 : remettre le déclenchement sur les tags « v[0-9]+.[0-9]+.[0-9]+ »
# et PUBLICATION_PAR_CI=1 dans build.sh.
on:
  # La publication se fait depuis le Mac (sh build.sh --publish X.Y.Z) tant
  # que le runner n'a pas Xcode 27 ; ce workflow ne sert qu'à la rejouer.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (ex. v0.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    # Toujours l'image du Xcode le plus récent, celui du développement : le
    # paquet déclare la dernière swift-tools-version, qu'un Xcode antérieur
    # refuse.
    runs-on: xcode-27

    steps:
      # Avant tout checkout : l'input est du texte libre. Il passe par
      # l'environnement (jamais interpolé dans le script), doit avoir la forme
      # d'un tag de version, nommer un tag existant (pas une branche
      # homonyme) et pointer un commit de main : seul ce code-là s'exécute
      # ensuite avec les secrets.
      - name: Déterminer la version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Tag « $TAG » mal formé — attendu vX.Y.Z ou vX.Y.Z-rc.N (ex. v0.1.0)."
            exit 1
          fi
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)" || {
            echo "::error::Le tag « $TAG » n'existe pas."; exit 1; }
          STATUT="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$SHA" --jq .status)"
          if [[ "$STATUT" != "identical" && "$STATUT" != "behind" ]]; then
            echo "::error::Le tag « $TAG » ($SHA) n'est pas un commit de main."
            exit 1
          fi
          echo "tag=$TAG"             >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"             >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"     >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.sha }}

      - name: Sélectionner Xcode
        run: |
          # Le plus récent qui porte le SDK macOS, bêta comprise.
          LATEST=""
          for x in $(ls -d /Applications/Xcode*.app | sort -rV); do
            if DEVELOPER_DIR="$x" xcrun --sdk macosx --show-sdk-version >/dev/null 2>&1; then
              LATEST="$x"; break
            fi
          done
          [ -n "$LATEST" ] || { echo "::error::aucun Xcode avec le SDK macOS"; exit 1; }
          echo "Xcode retenu : $LATEST"
          sudo xcode-select -s "$LATEST"
          # L'image pose un SDKROOT vers les Command Line Tools, absents : il
          # l'emporterait sur le Xcode choisi dans toutes les étapes suivantes.
          echo "SDKROOT avant : ${SDKROOT:-<vide>}"
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"
          export SDKROOT
          swift --version
          xcrun --show-sdk-version

      - name: Tests
        run: bash test.sh

      - name: Construire et publier
        env:
          GH_TOKEN: ${{ github.token }}
          # Statistiques d'utilisation (cf. build.sh) : sans ces deux secrets
          # du dépôt, publier-release.sh refuse de construire.
          TELEMETRIE_URL: ${{ secrets.TELEMETRIE_URL }}
          TELEMETRIE_JETON: ${{ secrets.TELEMETRIE_JETON }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash Tools/publier-release.sh "$VERSION"
