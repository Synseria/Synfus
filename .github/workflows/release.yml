name: Release

# Rejouer la publication d'un tag existant (Tools/publier-release.sh, le même
# chemin que `sh build.sh --publish X.Y.Z` depuis le Mac). Quand le runner
# aura Xcode 27 : remettre le déclenchement sur les tags « v[0-9]+.[0-9]+.[0-9]+ »
# et PUBLICATION_PAR_CI=1 dans build.sh.
on:
  # La publication se fait depuis le Mac (sh build.sh --publish X.Y.Z) tant
  # que le runner n'a pas Xcode 27 ; ce workflow ne sert qu'à la rejouer.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (ex. v0.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    # Toujours l'image du Xcode le plus récent, celui du développement : le
    # paquet déclare la dernière swift-tools-version, qu'un Xcode antérieur
    # refuse. Le deployment target reste 14.0 ; glassEffect (SDK ≥ 26) bascule
    # vers le matériau translucide à l'exécution.
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Sélectionner Xcode
        run: |
          # Le plus récent qui porte le SDK macOS, bêta comprise.
          LATEST=""
          for x in $(ls -d /Applications/Xcode*.app | sort -rV); do
            if DEVELOPER_DIR="$x" xcrun --sdk macosx --show-sdk-version >/dev/null 2>&1; then
              LATEST="$x"; break
            fi
          done
          [ -n "$LATEST" ] || { echo "::error::aucun Xcode avec le SDK macOS"; exit 1; }
          echo "Xcode retenu : $LATEST"
          sudo xcode-select -s "$LATEST"
          # L'image pose un SDKROOT vers les Command Line Tools, absents : il
          # l'emporterait sur le Xcode choisi dans toutes les étapes suivantes.
          echo "SDKROOT avant : ${SDKROOT:-<vide>}"
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"
          export SDKROOT
          swift --version
          xcrun --show-sdk-version

      - name: Déterminer la version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Le filtre de déclenchement ne couvre pas workflow_dispatch, dont le
          # tag est saisi à la main : on revérifie ici plutôt que de produire une
          # release au nom cassé.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag « $TAG » mal formé — attendu vX.Y.Z (ex. v0.1.0)."
            exit 1
          fi
          echo "tag=$TAG"             >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"     >> "$GITHUB_OUTPUT"

      - name: Tests
        run: bash test.sh

      - name: Construire et publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash Tools/publier-release.sh "${{ steps.version.outputs.version }}"
